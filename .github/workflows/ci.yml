name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: cli smoke
        run: |
          cargo build -p cascade-cli
          ./target/debug/cascade version
          ./target/debug/cascade run
          ./target/debug/cascade serve --data "$RUNNER_TEMP/cascade" &
          sleep 2
          ./target/debug/cascade start --workflow-type order --input '{"sku": "ci"}'
          curl -fsS localhost:7233/workflows

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: syntax
        run: python -m py_compile packages/cascade-python/src/cascade/__init__.py
